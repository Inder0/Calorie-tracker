
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
    <title>{% block title %}Macro Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-gray-900 text-white min-h-screen">



    <nav class="bg-gray-800 border-b border-gray-700 w-full">
        <div class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-4 flex justify-between items-center">
            <h1 class="text-lg sm:text-xl font-bold">MacroTracker</h1>
            {% if user.is_authenticated %}
            <div class="space-x-4 sm:space-x-6 text-xs sm:text-sm">
                <a href="/" class="hover:text-blue-400">Dashboard</a>
                <a href="{% url 'profile' %}" class="hover:text-blue-400">Profile</a>
                <a href="{% url 'logout' %}" class="text-red-400">Logout</a>

            {% else %}
                <a href="{% url 'login' %}" class="text-gray-100 text-bold">Login</a>
            {% endif %}
            </div>
        </div>

    </nav>

    <main class="w-full px-4 sm:px-6 py-6 my-6">
        <div class="max-w-5xl mx-auto w-full">
            {% block content %}{% endblock %}
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function renderChart() {
    const oldCanvas = document.getElementById('macroChart');
    if (!oldCanvas) return;
    const data = oldCanvas.dataset;
    const parent = oldCanvas.parentNode;
    parent.innerHTML = `
        <canvas id="macroChart"
            data-carbs="${data.carbs}"
            data-protein="${data.protein}"
            data-fat="${data.fat}">
        </canvas>
    `;

    const ctx = document.getElementById('macroChart');

    const carbs = Number(ctx.dataset.carbs) || 0;
    const protein = Number(ctx.dataset.protein) || 0;
    const fat = Number(ctx.dataset.fat) || 0;

    window.macroChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Carbs', 'Protein', 'Fat'],
            datasets: [{
                data: [carbs, protein, fat],
                backgroundColor: ['#3b82f6','#22c55e','#ef4444']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                   display: false
                }
            }
        }
    });
}
document.addEventListener("DOMContentLoaded", renderChart);
document.body.addEventListener("htmx:afterSwap", function(evt) {
    if (evt.target.id === "dashboard") {
        renderChart();
    }
});

</script>

</body>

</html>

<style>
    .helptext {
        display: block;
        font-size: 0.75rem;
        color: #94a3b8; /* slate-400 */
        margin-top: 0.25rem;
        line-height: 1.2;
    }
</style>
