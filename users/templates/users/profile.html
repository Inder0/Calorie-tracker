<form method="post" class="max-w-md mx-auto space-y-4">
  {% csrf_token %}

  <input type="number" step="0.1" name="weight" 
         value="{{ form.weight.value|default:'' }}" 
         placeholder="Weight (kg)" class="w-full p-2 border rounded">

  <input type="number" step="0.1" name="height" 
         value="{{ form.height.value|default:'' }}" 
         placeholder="Height (cm)" class="w-full p-2 border rounded">

  <input type="number" name="daily_calorie_goal" 
         value="{{ form.daily_calorie_goal.value }}" 
         class="w-full p-2 border rounded">

  <button class="bg-blue-500 text-white px-4 py-2 rounded">
    Save
  </button>
</form>
